[project]
name = "kutsh-crm"
version = "0.1.0"
description = "Couche Python du CRM Kutsh (Twenty) — abstraction crm_client + serveur MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
kutsh-crm-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["mcp_server.py", "crm_client.py"]
